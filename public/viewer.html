<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not Görüntüle - Kimya_not</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
html,body { background:#e8e8ed; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif; height:100%; overflow:hidden; touch-action:manipulation; }
.navbar { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:white; border-bottom:1px solid #e8e8ed; flex-shrink:0; }
.navbar a { color:#0056cc; text-decoration:none; font-size:0.85rem; font-weight:500; padding:8px 14px; border-radius:8px; transition:background 0.2s; -webkit-tap-highlight-color:transparent; }
.navbar a:hover { background:#f0f7ff; }
.navbar span { font-size:0.82rem; color:#8e8e93; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 8px; }
.viewer-wrap { position:relative; width:100%; height:calc(100vh - 48px); overflow:hidden; display:flex; align-items:center; justify-content:center; background:#e8e8ed; }
.viewer-wrap iframe { width:100%; height:100%; border:none; }
.viewer-wrap img { max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; display:block; margin:auto; }
.watermark { position:fixed; top:0; left:0; right:0; bottom:0; pointer-events:none; z-index:10; }
.watermark::before { content:"Kimya_not"; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-30deg); font-size:clamp(1.5rem,6vw,4rem); font-weight:800; color:rgba(10,26,58,0.04); white-space:nowrap; letter-spacing:4px; }
.watermark::after { content:attr(data-user); position:fixed; bottom:12px; right:16px; font-size:clamp(0.5rem,1.5vw,0.7rem); color:rgba(10,26,58,0.1); font-weight:500; letter-spacing:0.5px; }
.open-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; width:100%; height:100%; background:none; border:none; cursor:pointer; font-family:inherit; color:#1d1d1f; -webkit-tap-highlight-color:transparent; z-index:5; position:relative; }
.open-btn:active { opacity:0.7; }
.open-icon { font-size:3rem; }
.open-label { font-size:1.1rem; font-weight:600; color:#0056cc; }
.open-sub { font-size:0.8rem; color:#8e8e93; }
@media (max-width:600px) { .navbar { padding:8px 10px; } .navbar a { font-size:0.78rem; padding:6px 10px; } .navbar span { font-size:0.75rem; max-width:140px; } .open-icon { font-size:2.5rem; } .open-label { font-size:1rem; } }
</style>
</head>
<body>
<div class="navbar">
  <a href="/" id="backBtn">← Ana Sayfa</a>
  <span id="fileName">Not</span>
  <span id="pageInfo"></span>
</div>
<div class="viewer-wrap" id="viewerWrap">
  <div class="watermark" id="watermark"></div>
  <iframe id="pdfViewer" style="display:none"></iframe>
  <img id="imgViewer" style="display:none" draggable="false">
  <button class="open-btn" id="openBtn">
    <div class="open-icon" id="openIcon">📄</div>
    <div class="open-label" id="openLabel">Dokun ve Görüntüle</div>
    <div class="open-sub" id="openSub">PDF — Kimya_not</div>
  </button>
</div>
<script>
function isMobile() {
  return /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini|Mobile|mobile/i.test(navigator.userAgent);
}

const params = new URLSearchParams(location.search);
const file = params.get("file");
const name = params.get("name") || "Not";
const fileNameEl = document.getElementById("fileName");
const pageInfo = document.getElementById("pageInfo");
fileNameEl.textContent = name;

const idx = file.lastIndexOf("/");
document.getElementById("backBtn").href = idx >= 0 ? "/#" + file.substring(0, idx) : "/";

const ext = name.split(".").pop().toLowerCase();
const pdfViewer = document.getElementById("pdfViewer");
const imgViewer = document.getElementById("imgViewer");
const openBtn = document.getElementById("openBtn");
const openIcon = document.getElementById("openIcon");
const openLabel = document.getElementById("openLabel");
const openSub = document.getElementById("openSub");
const viewerSrc = "/view/" + encodeURI(file);

if (ext === "pdf") {
  openIcon.textContent = "📄";
  pageInfo.textContent = "PDF";
  if (isMobile()) {
    openLabel.textContent = "PDF'i Aç";
    openSub.textContent = name;
    openBtn.onclick = function() { window.location.href = viewerSrc; };
  } else {
    pdfViewer.style.display = "block";
    pdfViewer.src = viewerSrc;
    openBtn.onclick = function() { window.open(viewerSrc, "_blank"); };
    openLabel.textContent = "PDF'i Yeni Sekmede Aç";
    openSub.textContent = "Eğer görüntülenmezse tıklayın";
    setTimeout(function() {
      try {
        const doc = pdfViewer.contentDocument || pdfViewer.contentWindow?.document;
        if (!doc || !doc.body || doc.body.innerHTML === "" || doc.body.children.length === 0) {
          openBtn.style.display = "flex";
        } else {
          openBtn.style.display = "none";
        }
      } catch(e) {
        openBtn.style.display = "flex";
      }
    }, 3000);
  }
} else {
  imgViewer.style.display = "block";
  imgViewer.src = viewerSrc;
  imgViewer.draggable = false;
  openBtn.style.display = "none";
  pageInfo.textContent = "Görsel";
}

fetch("/api/me").then(r=>r.json()).then(d=>{ if(d.user) document.getElementById("watermark").setAttribute("data-user",d.name+" "+d.surname); }).catch(()=>{});

let startX = 0;
const wrap = document.getElementById("viewerWrap");
wrap.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, { passive: true });
wrap.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 60) {
    document.activeElement && document.activeElement.blur();
    if (dx > 0) { history.back(); } else { history.forward(); }
  }
}, { passive: true });

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => { if (e.ctrlKey && (e.key==="s"||e.key==="S"||e.key==="p"||e.key==="P")) e.preventDefault(); });
document.addEventListener("dragstart", e => e.preventDefault());
</script>
</body>
</html>
